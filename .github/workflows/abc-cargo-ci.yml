name: abc-cargo-platform CI
on:
  push:
    paths: ['abc-cargo-platform/**', '.github/workflows/abc-cargo-ci.yml']
  pull_request:
    paths: ['abc-cargo-platform/**', '.github/workflows/abc-cargo-ci.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abc-cargo-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix server ci
      - run: npm --prefix server test
      - run: npm --prefix web ci
      - run: npm --prefix web run build
